name: Build and Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v1.0.0 or latest)'
        required: false
        default: 'latest'

concurrency:
  group: vps-hub-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/personal-vps-monitor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          # Read version from backend/app/version.py (__version__ = "X.Y.Z")
          VER=$(grep -oP '__version__\s*=\s*"\K[^"]+' backend/app/version.py || echo "")
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHA_SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            # Manual dispatch: honour the requested tag, plus the version tag if available
            TAGS="${BASE}:${INPUT_TAG}"
            if [ -n "$VER" ]; then TAGS="${TAGS},${BASE}:v${VER}"; fi
          else
            # Push to master: always tag :latest, plus :vX.Y.Z when version.py is present
            TAGS="${BASE}:latest"
            if [ -n "$VER" ]; then TAGS="${TAGS},${BASE}:v${VER}"; fi
          fi
          # Always add an immutable commit-SHA tag for rollback traceability
          TAGS="${TAGS},${BASE}:sha-${SHA_SHORT}"
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Resolved tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
