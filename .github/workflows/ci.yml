name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: akile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint & compile (Python backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps + ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check backend/app

      - name: Byte-compile backend
        run: python -m compileall -q backend/app

      - name: Import smoke test
        working-directory: backend
        run: python -c "import app.main; import app.akile_client; import app.poller; print('backend imports OK')"

  lint-frontend:
    name: Lint & build (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  image-healthcheck:
    name: Build image & probe /api/version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-backend, lint-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: akile-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run -d --name akile-ci -p 8080:80 akile-monitor:ci

      - name: Probe /api/version
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/version >/tmp/version.json 2>/dev/null; then
              echo "Health probe OK after ${i}s:"
              cat /tmp/version.json
              exit 0
            fi
            sleep 2
          done
          echo "Health probe FAILED — container never served /api/version"
          docker logs akile-ci || true
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f akile-ci || true
