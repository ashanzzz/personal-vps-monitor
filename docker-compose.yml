services:
  personal-vps-monitor:
    image: ghcr.io/ashanzzz/akile-monitor:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-vps-monitor
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - AKILE_TOKEN=${AKILE_TOKEN}
      - PUBLIC_READ_TOKEN=${PUBLIC_READ_TOKEN}
      - PUBLIC_CONTROL_TOKEN=${PUBLIC_CONTROL_TOKEN}
    volumes:
      - personal-vps-monitor-data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/version', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  personal-vps-monitor-data:
